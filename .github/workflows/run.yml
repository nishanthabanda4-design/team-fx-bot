name: 24/7 AI Signal Engine

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes automatically
  workflow_dispatch:        # Allows manual run from GitHub UI

jobs:
  run-bot:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests pandas ta numpy

    - name: Run Python Bot
      run: |
        python bot.py
