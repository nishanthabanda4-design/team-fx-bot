name: 24/7 AI Signal Engine

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 mins
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests pandas ta numpy
      - run: python bot.py
